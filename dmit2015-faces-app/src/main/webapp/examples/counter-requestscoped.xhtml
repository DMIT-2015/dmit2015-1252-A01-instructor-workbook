<!-- This is a Faces composition page that extends the layout template -->
<ui:composition
        template="/WEB-INF/faces-templates/layout.xhtml"
        xmlns:ui="jakarta.faces.facelets"
        xmlns:h="jakarta.faces.html"
        xmlns:f="jakarta.faces.core"
        xmlns:p="primefaces"
        xmlns:o="http://omnifaces.org/ui">

    <!-- Page metadata for title, description, and keywords -->
    <ui:param name="title" value="counter-requestscoped"/>

    <!-- Define main content for the page -->
    <ui:define name="maincontent">
        <div class="card">
            <h1 role="heading" aria-level="1">Counter | RequestScoped</h1>
            <h:form id="counter-requestscoped_form" role="form">
                <p:panel header="Welcome to Counter | RequestScoped">
                    <!-- Add page-specific content here, e.g., PrimeFaces components -->
                    <p:commandButton value="Increment Counter"
                                     actionListener="#{counterRequest.onSubmit()}"
                                     />
                </p:panel>
            </h:form>
        </div>
    </ui:define>

</ui:composition>
