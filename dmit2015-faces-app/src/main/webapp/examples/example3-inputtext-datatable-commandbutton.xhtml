<!-- This is a Faces composition page that extends the layout template -->
<ui:composition
        template="/WEB-INF/faces-templates/layout.xhtml"
        xmlns:ui="jakarta.faces.facelets"
        xmlns:h="jakarta.faces.html"
        xmlns:f="jakarta.faces.core"
        xmlns:p="primefaces"
        xmlns:o="http://omnifaces.org/ui">

    <!-- Page metadata for title, description, and keywords -->
    <ui:param name="title" value="example3-inputtext-datatable-commandbutton"/>

    <!-- Define main content for the page -->
    <ui:define name="maincontent">
        <div class="card">
            <h1 role="heading" aria-level="1">Example 3 - InputText, DataTable, and CommandButton</h1>
            <h:form id="example3-inputtext-datatable-commandbutton_form" role="form">
                <p:panel header="Welcome to Example 3 - InputText, DataTable, and CommandButton">
                    <!-- Add page-specific content here, e.g., PrimeFaces components -->
                    <div class="field">
                        <p:outputLabel for="@next">Task</p:outputLabel>
                        <p:inputText id="task"
                                     value="#{example3InputTextDataTableAndCommandButtonView.currentTask.description}"
                                     />
                        <p:message for="task" />
                    </div>
                    <div class="field">
                        <p:outputLabel for="@next">Priority</p:outputLabel>
                        <p:selectOneMenu value="#{example3InputTextDataTableAndCommandButtonView.currentTask.priority}">
                            <f:selectItems value="#{example3InputTextDataTableAndCommandButtonView.taskPriorties}"
                                           var="item"
                                           itemLabel="#{item}"
                                           itemValue="#{item}" />
                        </p:selectOneMenu>
                    </div>
                    <div class="field">
                        <p:outputLabel for="@next">Done</p:outputLabel>
                        <p:selectBooleanCheckbox value="#{example3InputTextDataTableAndCommandButtonView.currentTask.done}" />
                    </div>

                    <p:commandButton value="Add Task"
                                     action="#{example3InputTextDataTableAndCommandButtonView.onSubmitAddTask()}"
                                     update="@form taskTable"
                                     />
                    <p:spacer width="10px"/>
                    <p:commandButton value="Clear Table"
                                     action="#{example3InputTextDataTableAndCommandButtonView.onClearTable()}"
                                     update="taskTable"
                                     immediate="true"
                                     process="@this"
                                     />
                    <p:dataTable id="taskTable"
                                 value="#{example3InputTextDataTableAndCommandButtonView.tasks}"
                                 var="currentTask">
                        <p:column headerText="Description">
                            <h:outputText value="#{currentTask.description}" />
                        </p:column>
                        <p:column headerText="Priority">
                            <h:outputText value="#{currentTask.priority}" />
                        </p:column>
                        <p:column headerText="Done">
                            <p:selectBooleanCheckbox value="#{currentTask.done}" />
                        </p:column>
                        <p:column headerText="Action">
<p:commandButton value="Delete"
                 actionListener="#{example3InputTextDataTableAndCommandButtonView.onRemoveTask(currentTask)}"
                 update="taskTable"
                 immediate="true"
                 process="@this"
                 >
    <p:confirm type="popup"
               header="Confirm"
               message="Are you sure you want to delete this record?" />
</p:commandButton>

                        </p:column>

                    </p:dataTable>

                    <p:confirmPopup global="true">
                        <p:commandButton value="No" type="button" styleClass="ui-confirm-popup-no ui-button-flat" icon="pi pi-times"/>
                        <p:commandButton value="Yes" type="button" styleClass="ui-confirm-popup-yes" icon="pi pi-check"/>
                    </p:confirmPopup>

                </p:panel>
            </h:form>
        </div>
    </ui:define>

</ui:composition>
